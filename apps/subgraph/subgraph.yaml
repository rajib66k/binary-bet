specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MarketManager
    network: sepolia
    source:
      address: "0xB02eC4E5c3480e919dc0e2b24b8a4c248A31E10D"
      abi: MarketManager
      startBlock: 11654534
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - MarketCreated
        - OwnershipTransferred
      abis:
        - name: MarketManager
          file: ./abis/MarketManager.json
      eventHandlers:
        - event: MarketCreated(indexed address,address,bytes32)
          handler: handleMarketCreated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/market-manager.ts
  - kind: ethereum
    name: BinaryOracle
    network: sepolia
    source:
      address: "0x2642037C24B9946127714B8E58393Cd0f8B5F858"
      abi: BinaryOracle
      startBlock: 11654534
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - MarketResolved
        - BinaryOracleOwnershipTransferred
      abis:
        - name: BinaryOracle
          file: ./abis/BinaryOracle.json
      eventHandlers:
        - event: MarketResolved(indexed bytes32,indexed uint80,int256,uint256,uint8)
          handler: handleMarketResolved
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/binary-oracle.ts
templates:
  - kind: ethereum
    name: PredictionMarket
    network: sepolia
    source:
      abi: PredictionMarket
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Bought
        - FeeUpdated
        - Initialized
        - LiquidityAdded
        - LiquidityRefunded
        - LiquidityRemoved
        - MarketStateChanged
        - PredictionMarketOwnershipTransferred
        - PositionRedeemed
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - Sold
      abis:
        - name: PredictionMarket
          file: ./abis/PredictionMarket.json
      eventHandlers:
        - event: Bought(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handleBought
        - event: FeeUpdated(uint256,uint256)
          handler: handleFeeUpdated
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: LiquidityAdded(indexed address,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRefunded(indexed address,uint256,uint256)
          handler: handleLiquidityRefunded
        - event: LiquidityRemoved(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
        - event: MarketStateChanged(uint8)
          handler: handleMarketStateChanged
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: PositionRedeemed(address,uint256)
          handler: handlePositionRedeemed
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: Sold(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handleSold
      file: ./src/prediction-market.ts
